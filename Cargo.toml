[package]
name = "photocraft-ai-upscale-plugin"
version = "2.1.1"
edition = "2024"
license = "MIT"
publish = false
description = "Self-contained AI Upscale plugin for PhotoCraft"

[workspace]

[dependencies]
upscayl-rs = { path = "vendor/upscayl-rs" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
moxcms = "0.8.1"

[[bin]]
name = "photocraft-upscale-worker"
path = "src/worker.rs"

[[bin]]
name = "mock-ncnn"
path = "tests/fixtures/mock_ncnn.rs"
test = false

[profile.release]
opt-level = 3
lto = "thin"
strip = true
